<html lang="ko">

<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#111;--sub:#555;--mute:#8a8a8e;--line:#ececee;--bg:#fff;--soft:#f7f5f3;--chip:#f4ece8;--acc:#ff6a13;--acc2:#ff8a3d;--en:'Outfit','Pretendard',sans-serif;
 --focus:#ff6a13;--active:#2563eb;--wait:#d97706;--pause:#9ca3af;--idea:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.in{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;justify-content:space-between;height:60px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;color:var(--sub);font-weight:500}
.back:hover{color:var(--ink)}
.brand{font:700 18px var(--en);letter-spacing:-.02em;text-decoration:none}.brand b{color:var(--acc)}
.stamp{font-size:12.5px;color:var(--mute)}
.hero{padding:44px 0 8px}
.hero h1{margin:0;font-size:34px;letter-spacing:-.04em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:8px 0 0;color:var(--sub);font-size:15px}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:28px 0 8px}
.sum button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.sum button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.sum button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sum .n{display:block;font:700 30px/1.1 var(--en)}
.sum .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.todo{margin:28px 0 8px;border-radius:20px;background:var(--soft);padding:22px 24px}
.todo h2,.sec h2{margin:0 0 4px;font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.todo>p,.sec>.in>p.d{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.todo ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px dashed #e4ddd8}
.todo li .p{flex:none;font-size:11.5px;font-weight:700;background:#fff;border:1px solid #e9e1dc;border-radius:999px;padding:1px 9px;margin-top:2px;white-space:nowrap}
.todo li.hi .p{background:var(--acc);border-color:var(--acc);color:#fff}
.sec{padding:36px 0 0}
.sec h2 .c{font:600 14px var(--en);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:20px;padding:20px 22px 18px;background:#fff;display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s}
.card:hover{box-shadow:0 10px 30px rgba(0,0,0,.06)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ch h3{margin:0;font-size:18px;letter-spacing:-.03em}
.ch h3 small{display:block;font-size:12.5px;color:var(--mute);font-weight:500;letter-spacing:0;margin-top:2px}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--sub)}
.meta a{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.meta a:hover{color:var(--acc)}
.bar{height:6px;background:#f0eeec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.pr{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:5px}
.pr b{color:var(--ink);font:600 13px var(--en)}
.blk h4{margin:0 0 4px;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.blk ul{margin:0;padding:0 0 0 16px;font-size:13.5px;color:#333}
.blk li{margin:2px 0}
.blk.me{background:#fff6f0;border-radius:12px;padding:10px 12px}
.blk.me h4{color:var(--acc)}
.blk.dec{background:#f5f3ff;border-radius:12px;padding:10px 12px}
.blk.dec h4{color:var(--idea)}
.rows{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:170px 1fr 120px 92px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);font-size:13.5px}
.row:first-child{border-top:0}
.row b{font-size:14.5px}
.row .g{color:var(--sub)}
.row .dt{color:var(--mute);font:500 12.5px var(--en)}
.row a{text-decoration:none;color:var(--sub);font-size:12.5px}.row a:hover{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--chip);border-radius:999px;padding:7px 14px;font-size:13px;color:#3c4043}
.chips span small{color:var(--mute);margin-left:4px}
.note{margin:36px 0 0;padding:16px 18px;border-radius:14px;background:#f6f6f7;font-size:13px;color:var(--sub)}
footer{margin-top:48px;border-top:1px solid var(--line);padding:22px 0 40px;text-align:center;font-size:12.5px;color:var(--mute)}
[hidden]{display:none!important}
@media (max-width:860px){.sum{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.todo ul{grid-template-columns:1fr}.row{grid-template-columns:1fr auto;gap:4px 12px}.row .g{grid-column:1/-1;order:3}.row a{display:none}}
@media (max-width:520px){.in{padding:0 18px}.hero{padding-top:30px}.hero h1{font-size:27px}.sum{grid-template-columns:repeat(2,1fr);gap:10px}.sum button{padding:13px 14px}.sum .n{font-size:26px}.card{padding:18px}.todo{padding:18px}.stamp{display:none}}
</style>

<header class="top"><div class="in">

<main>
 <div class="in">

   <div class="sum" id="sum"></div>
  </section>

  <section class="todo" id="todo">

   <p>계정 설정이나 결정이 필요해서 대신할 수 없는 일만 모았어요.</p>
   <ul id="todoList"></ul>
  </section>
 </div>

 <div id="secs"></div>

 <div class="in">
  <p class="note">진행률은 남은 작업 목록을 기준으로 잡은 대략적인 값이에요. "진행 내역 확인 필요"로 표시된 프로젝트는 저장소 날짜만 확인했고, 다음에 저장소를 열어 볼 때 내용을 채워요.</p>
 </div>
</main>

<footer><div class="in">© 2026 IUX Work · 진행 현황</div></footer>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var EXT='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
var GH='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>';
var cur='all';

function badge(s){var x=STATUS[s];return '<span class="badge" style="background:'+x.c+'">'+x.t+'</span>'}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
function card(p){
 var h='<article class="card" data-s="'+p.s+'"><div class="ch"><h3>'+esc(p.t)+'<small>'+esc(p.g)+' · '+esc(p.stage)+'</small></h3>'+badge(p.s)+'</div>';
 h+='<div class="meta"><span>마지막 작업 '+esc(p.last)+'</span>'+(p.url?'<a href="'+p.url+'" target="_blank" rel="noopener">'+EXT+p.url.replace('https://','')+'</a>':'')+'<a href="https://github.com/handgoldking1234/'+p.repo+'" target="_blank" rel="noopener">'+GH+p.repo+'</a></div>';
 if(p.p!=null)h+='<div><div class="pr"><span>진행률</span><b>'+p.p+'%</b></div><div class="bar"><i style="width:'+p.p+'%"></i></div></div>';
 if(p.done.length)h+='<div class="blk"><h4>최근 한 일</h4>'+ul(p.done)+'</div>';
 if(p.next.length)h+='<div class="blk"><h4>다음 할 일</h4>'+ul(p.next)+'</div>';
 if(p.me.length)h+='<div class="blk me"><h4>직접 하실 일</h4>'+ul(p.me)+'</div>';
 if(p.dec.length)h+='<div class="blk dec"><h4>정하실 것</h4>'+ul(p.dec)+'</div>';
 return h+'</article>'}
function row(r){return '<div class="row" data-s="'+r.s+'"><b>'+esc(r.t)+'</b><span class="g">'+esc(r.g)+'</span><a href="'+r.url+'" target="_blank" rel="noopener">'+r.url.replace('https://','')+'</a><span class="dt">'+badge(r.s)+' '+esc(r.last)+'</span></div>'}

function count(s){if(s==='idea')return IDEAS.length;return P.filter(function(p){return p.s===s}).length+LIST.filter(function(r){return r.s===s}).length}

function draw(){
 $('stamp').textContent=UPDATED+' 기준';
 var h='';for(var k in STATUS)h+='<button type="button" data-s="'+k+'" title="'+esc(STATUS[k].d)+'"><span class="n">'+count(k)+'</span><span class="l"><i class="dot" style="background:'+STATUS[k].c+'"></i>'+STATUS[k].t+'</span></button>';
 $('sum').innerHTML=h;
 [].forEach.call($('sum').children,function(b){b.onclick=function(){cur=cur===b.dataset.s?'all':b.dataset.s;apply()}});

 var t=[];P.forEach(function(p){p.me.forEach(function(m){t.push({p:p.t,m:m,hi:p.s==='focus'})});p.dec.forEach(function(m){t.push({p:p.t,m:'결정: '+m,hi:false})})});
 CLEAN.forEach(function(c){t.push({p:'정리',m:c,hi:false})});
 $('todoList').innerHTML=t.map(function(x){return '<li class="'+(x.hi?'hi':'')+'"><span class="p">'+esc(x.p)+'</span><span>'+esc(x.m)+'</span></li>'}).join('');

 var s='';
 var groups=[['focus','지금 집중 중'],['active','이번 주 진행']];
 groups.forEach(function(g){var list=P.filter(function(p){return p.s===g[0]});if(!list.length)return;
  s+='<section class="sec" data-g="'+g[0]+'"><div class="in"><h2>'+g[1]+' <span class="c">'+list.length+'</span></h2><p class="d">'+STATUS[g[0]].d+'</p><div class="grid">'+list.map(card).join('')+'</div></div></section>'});
 [['wait','잠시 멈춤'],['pause','오래 멈춤']].forEach(function(g){var list=LIST.filter(function(r){return r.s===g[0]});
  s+='<section class="sec" data-g="'+g[0]+'"><div class="in"><h2>'+g[1]+' <span class="c">'+list.length+'</span></h2><p class="d">'+STATUS[g[0]].d+' · 진행 내역 확인 필요</p><div class="rows">'+list.map(row).join('')+'</div></div></section>'});
 s+='<section class="sec" data-g="idea"><div class="in"><h2>구상 중 <span class="c">'+IDEAS.length+'</span></h2><p class="d">'+STATUS.idea.d+'</p><div class="chips">'+IDEAS.map(function(i){return '<span>'+esc(i[0])+'<small>'+esc(i[1])+'</small></span>'}).join('')+'</div></div></section>';
 $('secs').innerHTML=s;
 apply()}

function apply(){
 [].forEach.call($('sum').children,function(b){b.setAttribute('aria-pressed',b.dataset.s===cur?'true':'false')});
 [].forEach.call(document.querySelectorAll('.sec'),function(sec){sec.hidden=cur!=='all'&&sec.dataset.g!==cur});
 $('todo').hidden=cur!=='all'}

draw();
</script>
</body>
</html>
